[project]
name = "HometownHeroes"
version = "0.1.0"
description = "Sports location data pipelines for birthplace, school, college, and professional associations."
requires-python = ">=3.11"
dependencies = [
  "geopy>=2.4",
  "pandas>=2.2",
  "pyarrow>=16",
  "rdata>=0.11",
]

[project.optional-dependencies]
notebook = [
  "folium>=0.17",
  "ipykernel>=6.29",
]

[tool.ruff]
line-length = 120

[tool.setuptools]
py-modules = []
