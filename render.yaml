services:
  - type: web
    name: HometownHeroes
    runtime: python
    plan: free
    buildCommand: pip install -e . && python pipelines/render_build.py
    startCommand: python scratch/pilot_visualizer_experiment.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HH_RENDER_SLEEP_SECONDS
        value: "0.2"
      - key: HH_DB_ARTIFACT_REPO
        value: amiel-paz/HometownHeroes
      - key: HH_DB_ARTIFACT_RELEASE_TAG
        value: data-latest
      - key: HH_DB_ARTIFACT_ASSET_NAME
        value: HometownHeroes.sqlite.gz
      - key: HH_DB_ARTIFACT_URL
        sync: false
      - key: HH_DB_ARTIFACT_TOKEN
        sync: false
      - key: HH_DB_ARTIFACT_SHA256
        sync: false
